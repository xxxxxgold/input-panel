name: Build macOS Universal Release Asset

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated SemVer tag to build
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release tag
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0

      - name: Verify annotated tag and version manifests
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = tag

          commit="$(git rev-parse "$RELEASE_TAG^{}")"
          test "$(git rev-parse HEAD)" = "$commit"
          version="${RELEASE_TAG#v}"
          export RELEASE_TAG version

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const expected = process.env.version;
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          if (![packageVersion, tauriVersion, cargoVersion].every((value) => value === expected)) {
            throw new Error(`Version manifests must all equal ${expected}.`);
          }
          NODE

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS Universal
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Check out locked tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify tag lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0

      - name: Record native build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run frontend quality checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm lint
          pnpm build
          pnpm check:css

      - name: Build Universal application and DMG
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Package and verify macOS assets
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path=""
          for candidate in "$bundle_root"/macos/*.app; do
            if [ -d "$candidate" ]; then
              app_path="$candidate"
              break
            fi
          done
          dmg_path=""
          for candidate in "$bundle_root"/dmg/*.dmg; do
            if [ -f "$candidate" ]; then
              dmg_path="$candidate"
              break
            fi
          done
          test -n "$app_path"
          test -n "$dmg_path"

          executable=""
          for candidate in "$app_path"/Contents/MacOS/*; do
            if [ -f "$candidate" ]; then
              executable="$candidate"
              break
            fi
          done
          test -n "$executable"
          test -x "$executable"
          universal_archs="$(lipo -archs "$executable")"
          printf '%s\n' "$universal_archs" | tr ' ' '\n' | grep -Fxq x86_64
          printf '%s\n' "$universal_archs" | tr ' ' '\n' | grep -Fxq arm64

          mkdir -p release-assets release-evidence portable-verify
          dmg_asset="InputPanel_${VERSION}_macos-universal.dmg"
          portable_asset="InputPanel_${VERSION}_macos-universal-portable.zip"
          cp "$dmg_path" "release-assets/$dmg_asset"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/$portable_asset"

          ditto -x -k "release-assets/$portable_asset" portable-verify
          portable_app=""
          for candidate in portable-verify/*.app; do
            if [ -d "$candidate" ]; then
              portable_app="$candidate"
              break
            fi
          done
          test -n "$portable_app"
          portable_executable=""
          for candidate in "$portable_app"/Contents/MacOS/*; do
            if [ -f "$candidate" ]; then
              portable_executable="$candidate"
              break
            fi
          done
          test -n "$portable_executable"
          test -x "$portable_executable"
          portable_archs="$(lipo -archs "$portable_executable")"
          printf '%s\n' "$portable_archs" | tr ' ' '\n' | grep -Fxq x86_64
          printf '%s\n' "$portable_archs" | tr ' ' '\n' | grep -Fxq arm64
          test -n "$(find "$portable_app/Contents/Resources" -type f -name manbo.mp3 -print -quit)"

          "$portable_executable" > smoke.stdout 2> smoke.stderr &
          app_pid=$!
          smoke_running=false
          for _ in {1..12}; do
            if kill -0 "$app_pid" 2>/dev/null; then
              smoke_running=true
              break
            fi
            sleep 1
          done
          if [ "$smoke_running" != true ]; then
            wait "$app_pid" || true
            cat smoke.stdout smoke.stderr
            exit 1
          fi
          kill -TERM "$app_pid" || true
          wait "$app_pid" || true
          rm -f smoke.stdout smoke.stderr

          export app_path portable_app executable portable_executable universal_archs portable_archs dmg_asset portable_asset
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const evidence = {
            schemaVersion: 1,
            releaseTag: process.env.RELEASE_TAG,
            commit: process.env.EXPECTED_COMMIT,
            version: process.env.VERSION,
            runner: { os: process.env.RUNNER_OS, arch: process.env.RUNNER_ARCH },
            assets: { dmg: process.env.dmg_asset, portableZip: process.env.portable_asset },
            universalArchitectures: process.env.universal_archs.trim().split(/\s+/),
            portableArchitectures: process.env.portable_archs.trim().split(/\s+/),
            portableBundle: {
              appBundle: path.basename(process.env.portable_app),
              executable: path.basename(process.env.portable_executable),
              soundResourcePresent: true,
            },
            smokeTest: { source: 'extracted-portable-bundle', processStayedRunning: true },
            signing: { developerId: 'not-configured', notarization: 'not-notarized' },
          };
          fs.writeFileSync('release-evidence/build-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          shasum -a 256 release-assets/* > release-evidence/SHA256SUMS.txt

      - name: Upload final assets and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inputpanel-${{ needs.preflight.outputs.version }}-macos-universal
          if-no-files-found: error
          retention-days: 7
          path: |
            release-assets/InputPanel_*.dmg
            release-assets/InputPanel_*-portable.zip
            release-evidence/build-evidence.json
            release-evidence/SHA256SUMS.txt
