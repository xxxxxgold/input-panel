name: Build Windows release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated SemVer tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          version="${tag#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
          test "$version" = "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Set Windows timezone
        shell: pwsh
        run: |
          tzutil /s "China Standard Time"
          if ((Get-TimeZone).Id -ne "China Standard Time") { throw "failed to set Windows timezone" }
      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
      - name: Quality gate
        shell: bash
        run: |
          pnpm lint
          TZ=Asia/Shanghai pnpm test
          pnpm check:css
          pnpm build:web
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Build Windows bundles
        shell: pwsh
        run: pnpm tauri build --bundles msi nsis
      - name: Collect and smoke Windows assets
        shell: pwsh
        run: |
          $version = '${{ needs.preflight.outputs.version }}'
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi "release-assets/InputPanel_${version}_windows-x64.msi"
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe "release-assets/InputPanel_${version}_windows-x64-setup.exe"
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item src-tauri/target/release/app.exe portable/app.exe
          if (Test-Path src-tauri/target/release/resources) { Copy-Item src-tauri/target/release/resources portable/resources -Recurse }
          $process = Start-Process -FilePath (Resolve-Path portable/app.exe) -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw 'portable app exited during smoke test' }
          Stop-Process -Id $process.Id
          Compress-Archive -Path portable/* -DestinationPath "release-assets/InputPanel_${version}_windows-x64-portable.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InputPanel-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
