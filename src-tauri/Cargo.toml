[package]
name = "app"
version = "0.1.0"
description = "A local Tauri workbench for managing Sub2API sites, accounts, keys, subscriptions, and usage."
authors = ["xxxxxgold"]
license = "GPL-3.0-only"
repository = "https://github.com/xxxxxgold/input-panel"
homepage = "https://github.com/xxxxxgold/input-panel"
readme = "../README.md"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
rusqlite = { version = "0.31", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
