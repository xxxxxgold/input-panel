<!doctype html>
<html lang="zh-CN" class="sakura-signal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var lastTheme = localStorage.getItem("input-panel.last-theme");
        if (lastTheme && /^[a-z][a-z-]*$/.test(lastTheme)) {
          document.documentElement.className = lastTheme;
        }
      } catch (e) {}
    </script>
    <title>Input悬浮面板</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/floating-panel-main.tsx"></script>
  </body>
</html>
