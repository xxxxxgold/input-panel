<!doctype html>
<html lang="zh-CN" class="sakura-signal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/src/assets/project-logo-64.webp" />
    <script>
      // 首帧前恢复上次主题，避免默认主题闪一下再切换（key 见 apply-theme.ts）。
      try {
        var lastTheme = localStorage.getItem("input-panel.last-theme");
        if (lastTheme && /^[a-z][a-z-]*$/.test(lastTheme)) {
          document.documentElement.className = lastTheme;
        }
      } catch (e) {}
    </script>
    <title>Input面板</title>
    <style>
      #startup-splash {
        --startup-splash-page: #f8eef6;
        --startup-splash-panel: rgba(255, 252, 255, 0.94);
        --startup-splash-text: #2c1f2e;
        --startup-splash-muted: #8f7f96;
        --startup-splash-accent: #ef78b0;
        --startup-splash-border: rgba(87, 60, 94, 0.14);
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--bg-page, var(--startup-splash-page));
        pointer-events: auto;
        opacity: 1;
        visibility: visible;
        transition: opacity 200ms ease, visibility 0s linear 200ms;
      }

      html.titan-noir #startup-splash {
        --startup-splash-page: #0b111a;
        --startup-splash-panel: rgba(18, 24, 35, 0.96);
        --startup-splash-text: #eef4ff;
        --startup-splash-muted: #8492a8;
        --startup-splash-accent: #7ec6ff;
        --startup-splash-border: rgba(171, 189, 212, 0.18);
      }

      html.arctic-relay #startup-splash {
        --startup-splash-page: #edf5fc;
        --startup-splash-panel: rgba(255, 255, 255, 0.94);
        --startup-splash-text: #152534;
        --startup-splash-muted: #778ca2;
        --startup-splash-accent: #35a9bf;
        --startup-splash-border: rgba(31, 60, 84, 0.16);
      }

      html.ember-circuit #startup-splash {
        --startup-splash-page: #1a1216;
        --startup-splash-panel: rgba(28, 20, 23, 0.96);
        --startup-splash-text: #f8efe9;
        --startup-splash-muted: #a38b84;
        --startup-splash-accent: #ff9863;
        --startup-splash-border: rgba(214, 185, 170, 0.18);
      }

      html.verdant-core #startup-splash {
        --startup-splash-page: #0b1611;
        --startup-splash-panel: rgba(16, 27, 21, 0.97);
        --startup-splash-text: #eff8f2;
        --startup-splash-muted: #879c90;
        --startup-splash-accent: #62d488;
        --startup-splash-border: rgba(177, 200, 186, 0.18);
      }

      #startup-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
      }

      .startup-splash-card {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 178px;
        padding: 14px 18px;
        border: 1px solid var(--border-strong, var(--startup-splash-border));
        border-radius: 8px;
        background: var(--bg-elevated, var(--startup-splash-panel));
        box-shadow: 0 18px 42px rgba(20, 13, 24, 0.16);
        color: var(--text-strong, var(--startup-splash-text));
      }

      .startup-splash-spinner {
        width: 19px;
        height: 19px;
        flex: 0 0 19px;
        border: 2px solid var(--startup-splash-border);
        border-color: color-mix(in srgb, var(--accent, var(--startup-splash-accent)) 24%, transparent);
        border-top-color: var(--accent, var(--startup-splash-accent));
        border-radius: 50%;
        animation: startup-splash-spin 760ms linear infinite;
      }

      .startup-splash-copy {
        display: inline-flex;
        align-items: baseline;
        color: var(--text-normal, var(--startup-splash-text));
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
      }

      .startup-splash-dots {
        display: inline-flex;
        gap: 3px;
        width: 16px;
        margin-left: 5px;
      }

      .startup-splash-dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--text-subtle, var(--startup-splash-muted));
        animation: startup-splash-dot 1.1s ease-in-out infinite;
      }

      .startup-splash-dot:nth-child(2) {
        animation-delay: 140ms;
      }

      .startup-splash-dot:nth-child(3) {
        animation-delay: 280ms;
      }

      @keyframes startup-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes startup-splash-dot {
        0%,
        70%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }

        35% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-splash,
        .startup-splash-spinner,
        .startup-splash-dot {
          animation: none;
        }

        #startup-splash {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-splash" role="status" aria-live="polite" aria-label="正在加载">
      <div class="startup-splash-card">
        <span class="startup-splash-spinner" aria-hidden="true"></span>
        <span class="startup-splash-copy">
          正在加载
          <span class="startup-splash-dots" aria-hidden="true">
            <span class="startup-splash-dot"></span>
            <span class="startup-splash-dot"></span>
            <span class="startup-splash-dot"></span>
          </span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
