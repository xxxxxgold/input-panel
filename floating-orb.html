<!doctype html>
<html lang="zh-CN" class="sakura-signal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var lastTheme = localStorage.getItem("input-panel.last-theme");
        if (lastTheme && /^[a-z][a-z-]*$/.test(lastTheme)) {
          document.documentElement.className = lastTheme;
        }
      } catch (e) {}
    </script>
    <title>Input悬浮图标</title>
    <style>
      html,
      body,
      #root {
        width: 60px;
        height: 60px;
        margin: 0;
        overflow: hidden;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/floating-orb-main.tsx"></script>
  </body>
</html>
